name: Revisar Feeds RSS

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ejecutar-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install feedparser requests

      - name: Ejecutar lector RSS
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEEDS_JSON: ${{ secrets.FEEDS_JSON }}
        run: python bot.py

      - name: Guardar historial
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add historial.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar historial" && git push)
