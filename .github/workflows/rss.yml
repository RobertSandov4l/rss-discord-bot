name: Revisar Feeds RSS

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ejecutar-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install feedparser requests

      - name: Ejecutar lector RSS
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEEDS_JSON: ${{ secrets.FEEDS_JSON }}
          SEMILLA_SIN_ENVIAR: ${{ vars.SEMILLA_SIN_ENVIAR || 'false' }}
        run: python bot.py

      - name: Guardar historial, log y rotacion
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add historial.json log_envios.json rotacion_imagenes.json || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Actualizar historial, log y rotacion"
            git pull --rebase origin main || true
            git push
          fi
